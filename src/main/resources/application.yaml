spring:
  application:
    name: quiz-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/quizdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080